[project]
name = "codemind"
version = "1.0.0"
description = "IDE-native AI coding agent — think Trae/Codex, not CLI."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
codemind = "codemind.cli:main"
codemind-web = "web.server:main"

[build-system]
requires = ["setuptools>=75.6"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["codemind*"]
