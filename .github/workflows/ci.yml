name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: python -c "from codemind.tools import BUILTIN_TOOLS, BUILTIN_HANDLERS; print(f'{len(BUILTIN_TOOLS)} tools, {len(BUILTIN_HANDLERS)} handlers')"
